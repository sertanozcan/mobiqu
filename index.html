<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yük Hacmi Yerleşim Hesaplayıcı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg: #0c0f13;
    --panel: #12161c;
    --panel-2: #171c23;
    --line: #232b34;
    --grid: #1a2028;
    --text: #e7ebef;
    --text-dim: #7d8894;
    --cyan: #4fd8c9;
    --cyan-dim: #2a6b64;
    --amber: #f2a63d;
    --danger: #e2634f;
    --radius: 3px;
    --viewport-bg: #080a0d;
    --hint-bg: rgba(12,15,19,0.7);
  }
  html[data-theme="light"]{
    --bg: #ffffff;
    --panel: #f4f5f7;
    --panel-2: #eceef1;
    --line: #dde1e6;
    --grid: #eef0f3;
    --text: #14181d;
    --text-dim: #6b7480;
    --cyan: #0f9c8c;
    --cyan-dim: #8fd6cb;
    --amber: #b5741a;
    --danger: #c23f2c;
    --viewport-bg: #ffffff;
    --hint-bg: rgba(255,255,255,0.85);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/40px 40px,
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    transition:background-color .2s, color .2s;
  }
  .page{
    height:100vh;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    display:flex;align-items:baseline;gap:14px;flex:none;
    padding: clamp(10px,2vh,22px) clamp(14px,2.4vw,28px) clamp(8px,1.4vh,16px);
    border-bottom:1px solid var(--line);
  }
  .theme-toggle{
    margin-left:auto;align-self:center;display:flex;align-items:center;gap:7px;
    cursor:pointer;padding:6px 13px;border:1px solid var(--line);border-radius:20px;
    background:var(--panel);font-family:'JetBrains Mono',monospace;font-size:11px;
    letter-spacing:0.5px;color:var(--text-dim);user-select:none;transition:border-color .15s;
  }
  .theme-toggle:hover{border-color:var(--cyan-dim);}
  .theme-toggle .theme-icon{font-size:14px;line-height:1;}
  .theme-toggle .theme-label{text-transform:uppercase;color:var(--text);}
  .topbar .mark{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(16px,1.6vh + 8px,20px);letter-spacing:0.5px;
    color:var(--text);
  }
  .topbar .mark span{color:var(--cyan);}
  .topbar .sub{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);
    letter-spacing:0.5px;
  }
  .layout{
    display:grid;
    grid-template-columns: clamp(260px,22vw,340px) 1fr;
    gap:1px;
    background:var(--line);
    flex:1;
    min-height:0;
  }
  @media (max-width: 880px){
    html,body{overflow:auto;}
    .page{height:auto;min-height:100vh;}
    .layout{grid-template-columns:1fr;}
  }
  .panel{background:var(--bg);padding:clamp(12px,2vh,22px) clamp(14px,1.6vw,22px) clamp(14px,2vh,30px);overflow-y:auto;min-height:0;}
  .section-label{
    font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--cyan);margin:0 0 clamp(6px,1.2vh,12px);
    display:flex;align-items:center;gap:8px;
  }
  .section-label::before{
    content:'';width:12px;height:1px;background:var(--cyan-dim);display:inline-block;
  }
  .field-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:clamp(8px,1.6vh,14px);}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.5px;}
  .field input{
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    font-family:'JetBrains Mono',monospace;font-size:14px;padding:clamp(5px,1vh,8px) 8px;
    border-radius:var(--radius);width:100%;
  }
  .field input:focus{outline:none;border-color:var(--cyan-dim);}
  .field select{
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    font-family:'JetBrains Mono',monospace;font-size:13px;padding:clamp(5px,1vh,8px) 8px;
    border-radius:var(--radius);width:100%;
  }
  .field select:focus{outline:none;border-color:var(--cyan-dim);}
  .field select:disabled{opacity:.5;cursor:not-allowed;}
  .field .readout{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;font-size:14px;padding:clamp(5px,1vh,8px) 8px;
    border-radius:var(--radius);width:100%;
  }
  .select-row{margin-bottom:clamp(8px,1.6vh,14px);}
  .divider{height:1px;background:var(--line);margin:clamp(12px,2.4vh,22px) 0;}
  .rotate-opt{
    display:flex;gap:10px;align-items:flex-start;padding:clamp(6px,1.2vh,10px) 10px;
    border:1px solid var(--line);border-radius:var(--radius);margin-bottom:clamp(5px,1vh,8px);
    cursor:pointer;background:var(--panel);transition:border-color .15s;
  }
  .rotate-opt:hover{border-color:var(--cyan-dim);}
  .rotate-opt.active{border-color:var(--cyan);background:var(--panel-2);}
  .rotate-opt input{margin-top:3px;accent-color:var(--cyan);}
  .rotate-opt .t{font-size:12.5px;color:var(--text);font-weight:500;}
  .rotate-opt .d{font-size:11px;color:var(--text-dim);margin-top:2px;line-height:1.4;}
  .run-btn{
    width:100%;padding:clamp(9px,1.6vh,13px);margin-top:6px;
    background:var(--cyan);color:#06110f;border:none;border-radius:var(--radius);
    font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:1px;
    text-transform:uppercase;cursor:pointer;transition:filter .15s;
  }
  .run-btn:hover{filter:brightness(1.08);}
  .run-btn:active{filter:brightness(0.95);}
  .viewport-wrap{
    position:relative;background:var(--viewport-bg);overflow:hidden;
    min-height:0;display:flex;flex-direction:column;
    transition:background-color .2s;
  }
  .viewport-header{
    display:flex;justify-content:space-between;align-items:center;flex:none;
    padding:clamp(8px,1.6vh,14px) 20px;border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);
  }
  .stat-strip{display:flex;gap:26px;flex-wrap:wrap;}
  .stat-strip .stat b{color:var(--cyan);font-size:16px;font-family:'JetBrains Mono',monospace;display:block;}
  .stat-strip .stat span{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;}
  #canvas-holder{flex:1;position:relative;min-height:180px;}
  #canvas-holder canvas{display:block;width:100%;height:100%;}
  .corner{position:absolute;width:18px;height:18px;border-color:var(--cyan-dim);opacity:.7;pointer-events:none;}
  .corner.tl{top:10px;left:10px;border-top:2px solid;border-left:2px solid;}
  .corner.tr{top:10px;right:10px;border-top:2px solid;border-right:2px solid;}
  .corner.bl{bottom:10px;left:10px;border-bottom:2px solid;border-left:2px solid;}
  .corner.br{bottom:10px;right:10px;border-bottom:2px solid;border-right:2px solid;}
  .hint{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);
    background:var(--hint-bg);padding:4px 10px;border-radius:20px;border:1px solid var(--line);
    pointer-events:none;
  }
  .legend{
    display:flex;gap:14px;flex-wrap:wrap;padding:clamp(8px,1.4vh,12px) 20px;border-top:1px solid var(--line);flex:none;
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);
    max-height:22vh;overflow-y:auto;
  }
  .legend .item{display:flex;align-items:center;gap:6px;}
  .legend .swatch{width:10px;height:10px;border-radius:2px;flex:none;}
  .empty-msg{
    display:flex;align-items:center;justify-content:center;height:100%;
    color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:12px;text-align:center;padding:20px;
  }
  .warn{
    font-size:11px;color:var(--amber);font-family:'JetBrains Mono',monospace;
    margin-top:10px;line-height:1.5;
  }
</style>
</head>
<body>

<div class="page">
<div class="topbar">
  <div class="mark">MOBIQU</div>
  <div class="sub">3D Packing Optimizer — Mobiqu packing</div>
  <div class="theme-toggle" id="themeToggle" role="button" tabindex="0" title="Görünümü değiştir">
    <span class="theme-icon" id="themeIcon">🌙</span>
    <span class="theme-label" id="themeLabel">Dark</span>
  </div>
</div>

<div class="layout">
  <div class="panel">
    <div class="section-label">Dış Yük Hacmi</div>
    <div class="select-row field">
      <label>Sıcaklık Aralığı</label>
      <select id="tempRange">
        <option value="">Seçiniz</option>
        <option value="+2/+8">+2 / +8 °C</option>
        <option value="-25/-15">-25 / -15 °C</option>
        <option value="+15/+25">+15 / +25 °C</option>
      </select>
    </div>
    <div class="select-row field">
      <label>Ürün</label>
      <select id="productSelect" disabled>
        <option value="">Önce sıcaklık aralığı seçin</option>
      </select>
    </div>
    <div class="field-row" id="dimReadout" style="display:none;">
      <div class="field"><label>Uzunluk (L)</label><div class="readout" id="ro-L">—</div></div>
      <div class="field"><label>Genişlik (W)</label><div class="readout" id="ro-W">—</div></div>
      <div class="field"><label>Yükseklik (H)</label><div class="readout" id="ro-H">—</div></div>
    </div>
    <input type="hidden" id="L" value="">
    <input type="hidden" id="W" value="">
    <input type="hidden" id="H" value="">

    <div class="section-label">İç Kutu Ölçüleri</div>
    <div class="field-row">
      <div class="field"><label>Uzunluk (l)</label><input type="number" id="bl" value="70" min="0.01" step="any"></div>
      <div class="field"><label>Genişlik (w)</label><input type="number" id="bw" value="45" min="0.01" step="any"></div>
      <div class="field"><label>Yükseklik (h)</label><input type="number" id="bh" value="110" min="0.01" step="any"></div>
    </div>
    <div style="font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;margin:-6px 0 4px;">Birim: mm — iç kutu ölçülerini milimetre cinsinden girin</div>

    <div class="divider"></div>

    <div class="section-label">Döndürme İzni</div>
    <label class="rotate-opt active" id="opt-z">
      <input type="radio" name="rotmode" value="z" checked>
      <div>
        <div class="t">Sadece dikey eksen (Z)</div>
        <div class="d">Yükseklik yönü sabit kalır, kutu sadece tabanda 90° döner. Dik durması gereken ürünler için (sıvı ilaç vb.)</div>
      </div>
    </label>
    <label class="rotate-opt" id="opt-free">
      <input type="radio" name="rotmode" value="free">
      <div>
        <div class="t">3 eksende serbest 90°</div>
        <div class="d">Kutunun herhangi bir yüzü tabana gelebilir. En yüksek doluluk oranı için tüm 6 yönelim denenir.</div>
      </div>
    </label>

    <button class="run-btn" id="runBtn">Hesapla</button>
    <div class="warn" id="warnBox" style="display:none;"></div>
  </div>

  <div class="viewport-wrap">
    <div class="viewport-header">
      <div class="stat-strip" id="statStrip">
        <div class="stat"><b id="stat-count">—</b><span>Toplam Adet</span></div>
        <div class="stat"><b id="stat-eff">—</b><span>Doluluk Oranı</span></div>
        <div class="stat"><b id="stat-vol">—</b><span>Kalan Boş Hacim</span></div>
      </div>
    </div>
    <div id="canvas-holder">
      <div class="empty-msg" id="emptyMsg">Ölçüleri girip "Hesapla" butonuna basın</div>
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="hint">sürükle: döndür · tekerlek: yakınlaştır</div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</div>
</div>

<script>
const EPS = 1e-6;
const PALETTE = ['#4fd8c9','#f2a63d','#e2634f','#8b7ce8','#5fb0e8','#e6d24f','#7ce88b','#e87cc9'];

// ---------- theme toggle (view-only, never touches the calculation state) ----------
(function(){
  const btn = document.getElementById('themeToggle');
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  function apply(theme){
    if(theme==='light'){
      document.documentElement.setAttribute('data-theme','light');
      icon.textContent = '☀️';
      label.textContent = 'Light';
    } else {
      document.documentElement.removeAttribute('data-theme');
      icon.textContent = '🌙';
      label.textContent = 'Dark';
    }
  }
  btn.addEventListener('click', ()=>{
    const isLight = document.documentElement.getAttribute('data-theme')==='light';
    apply(isLight ? 'dark' : 'light');
  });
  btn.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); btn.click(); }
  });
})();

// ---------- outer box product catalog (mm) ----------
// Dimensions unaffected by the selected temperature range
const PRODUCTS_FIXED = [
  {name:'Multi-4',    l:160, w:160, h:160},
  {name:'Multi-12',   l:270, w:270, h:170},
  {name:'Multi-28',   l:305, w:305, h:305},
  {name:'Multi4E',    l:145, w:145, h:145},
  {name:'Multi-12E',  l:220, w:220, h:220},
  {name:'Multi-28E',  l:300, w:300, h:285},
  {name:'Multi-42E',  l:460, w:305, h:290},
  {name:'Single-4',   l:152, w:152, h:152},
  {name:'Single-12',  l:263, w:263, h:162},
  {name:'Single-24',  l:287, w:287, h:287},
  {name:'Single-4P',  l:155, w:155, h:145},
  {name:'Single-12P', l:225, w:225, h:215},
  {name:'Single-4V',  l:145, w:145, h:145},
  {name:'Single-12V', l:220, w:220, h:218},
  {name:'Single-28V', l:295, w:295, h:285},
  {name:'Single-42V', l:460, w:305, h:290},
];
// Dimensions that change depending on the selected temperature range
const PRODUCTS_TEMP = {
  '+2/+8': [
    {name:'Single-28P', l:300, w:300, h:300},
    {name:'Single-56P', l:375, w:375, h:375},
    {name:'Single-72P', l:500, w:375, h:375},
  ],
  '-25/-15': [
    {name:'Single-28P', l:300, w:300, h:300},
    {name:'Single-56P', l:375, w:375, h:375},
    {name:'Single-72P', l:500, w:375, h:375},
  ],
  '+15/+25': [
    {name:'Single-28P', l:320, w:320, h:320},
    {name:'Single-56P', l:395, w:375, h:395},
    {name:'Single-72P', l:520, w:395, h:395},
  ],
};

(function(){
  const tempSelect = document.getElementById('tempRange');
  const productSelect = document.getElementById('productSelect');
  const dimReadout = document.getElementById('dimReadout');
  const roL = document.getElementById('ro-L');
  const roW = document.getElementById('ro-W');
  const roH = document.getElementById('ro-H');
  const hiddenL = document.getElementById('L');
  const hiddenW = document.getElementById('W');
  const hiddenH = document.getElementById('H');

  function clearSelection(){
    dimReadout.style.display = 'none';
    hiddenL.value = ''; hiddenW.value = ''; hiddenH.value = '';
  }

  function populateProducts(){
    const temp = tempSelect.value;
    clearSelection();
    if(!temp){
      productSelect.disabled = true;
      productSelect.innerHTML = '<option value="">Önce sıcaklık aralığı seçin</option>';
      return;
    }
    productSelect.disabled = false;
    const opts = ['<option value="">Ürün seçin</option>'];
    PRODUCTS_FIXED.forEach((p,i)=> opts.push(`<option value="fixed:${i}">${p.name}</option>`));
    PRODUCTS_TEMP[temp].forEach((p,i)=> opts.push(`<option value="temp:${i}">${p.name}</option>`));
    productSelect.innerHTML = opts.join('');
  }

  function selectProduct(){
    const val = productSelect.value;
    if(!val){ clearSelection(); return; }
    const [kind, idxStr] = val.split(':');
    const idx = parseInt(idxStr, 10);
    const p = kind==='fixed' ? PRODUCTS_FIXED[idx] : PRODUCTS_TEMP[tempSelect.value][idx];
    hiddenL.value = p.l; hiddenW.value = p.w; hiddenH.value = p.h;
    roL.textContent = p.l + ' mm';
    roW.textContent = p.w + ' mm';
    roH.textContent = p.h + ' mm';
    dimReadout.style.display = 'grid';
  }

  tempSelect.addEventListener('change', populateProducts);
  productSelect.addEventListener('change', selectProduct);
})();

// ---------- orientation generation ----------
function dedupeOrientations(list){
  const seen = new Set(); const out=[];
  for(const o of list){
    const key = o.dx.toFixed(6)+'_'+o.dy.toFixed(6)+'_'+o.dz.toFixed(6);
    if(!seen.has(key)){ seen.add(key); out.push(o); }
  }
  return out;
}
function getOrientations(l,w,h,mode){
  if(mode==='z'){
    return dedupeOrientations([
      {dx:l,dy:w,dz:h},
      {dx:w,dy:l,dz:h}
    ]);
  }
  const p = [
    {dx:l,dy:w,dz:h},{dx:l,dy:h,dz:w},
    {dx:w,dy:l,dz:h},{dx:w,dy:h,dz:l},
    {dx:h,dy:l,dz:w},{dx:h,dy:w,dz:l}
  ];
  return dedupeOrientations(p);
}

// ---------- guillotine recursive solver ----------
function solveBin(L,W,H,depth,orientations,memo){
  if(depth<=0 || L<=EPS || W<=EPS || H<=EPS) return {count:0, placements:[]};
  const key = L.toFixed(3)+'|'+W.toFixed(3)+'|'+H.toFixed(3)+'|'+depth;
  if(memo.has(key)) return memo.get(key);

  let best = {count:0, placements:[]};

  for(const o of orientations){
    const nx = Math.floor((L+EPS)/o.dx);
    const ny = Math.floor((W+EPS)/o.dy);
    const nz = Math.floor((H+EPS)/o.dz);
    if(nx<=0||ny<=0||nz<=0) continue;

    const usedX = nx*o.dx, usedY = ny*o.dy, usedZ = nz*o.dz;
    const gridCount = nx*ny*nz;
    const gridPlacements = [];
    for(let i=0;i<nx;i++)
      for(let j=0;j<ny;j++)
        for(let k=0;k<nz;k++)
          gridPlacements.push({x:i*o.dx,y:j*o.dy,z:k*o.dz,dx:o.dx,dy:o.dy,dz:o.dz});

    const remX = L-usedX, remY = W-usedY, remZ = H-usedZ;
    let subCount=0, subPlacements=[];

    if(remX>EPS){
      const r = solveBin(remX,W,H,depth-1,orientations,memo);
      subCount += r.count;
      subPlacements.push(...r.placements.map(p=>({...p,x:p.x+usedX})));
    }
    if(remY>EPS){
      const r = solveBin(usedX,remY,H,depth-1,orientations,memo);
      subCount += r.count;
      subPlacements.push(...r.placements.map(p=>({...p,y:p.y+usedY})));
    }
    if(remZ>EPS){
      const r = solveBin(usedX,usedY,remZ,depth-1,orientations,memo);
      subCount += r.count;
      subPlacements.push(...r.placements.map(p=>({...p,z:p.z+usedZ})));
    }

    const total = gridCount+subCount;
    if(total>best.count){
      best = {count: total, placements: gridPlacements.concat(subPlacements)};
    }
  }
  memo.set(key,best);
  return best;
}

// ---------- three.js scene ----------
let scene, camera, renderer, group;
let azimuth=0.7, polar=1.05, radius=10;
let dragging=false, lastX=0, lastY=0;
let containerEl;

function initThree(){
  containerEl = document.getElementById('canvas-holder');
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, containerEl.clientWidth/containerEl.clientHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(containerEl.clientWidth, containerEl.clientHeight);
  containerEl.appendChild(renderer.domElement);

  const amb = new THREE.AmbientLight(0xffffff, 0.65);
  scene.add(amb);
  const dir = new THREE.DirectionalLight(0xffffff, 0.7);
  dir.position.set(5,10,7);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0x4fd8c9, 0.25);
  dir2.position.set(-6,-3,-4);
  scene.add(dir2);

  group = new THREE.Group();
  scene.add(group);

  updateCamera();
  animate();

  renderer.domElement.addEventListener('mousedown', e=>{dragging=true; lastX=e.clientX; lastY=e.clientY;});
  window.addEventListener('mouseup', ()=>dragging=false);
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const dx = e.clientX-lastX, dy = e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY;
    azimuth -= dx*0.006;
    polar = Math.min(Math.PI-0.15, Math.max(0.15, polar - dy*0.006));
    updateCamera();
  });
  renderer.domElement.addEventListener('wheel', e=>{
    e.preventDefault();
    radius = Math.min(60, Math.max(2, radius*(1+e.deltaY*0.0012)));
    updateCamera();
  }, {passive:false});

  let touchLast=null;
  renderer.domElement.addEventListener('touchstart', e=>{ if(e.touches.length===1) touchLast={x:e.touches[0].clientX,y:e.touches[0].clientY}; });
  renderer.domElement.addEventListener('touchmove', e=>{
    if(e.touches.length===1 && touchLast){
      const dx = e.touches[0].clientX-touchLast.x, dy = e.touches[0].clientY-touchLast.y;
      touchLast = {x:e.touches[0].clientX,y:e.touches[0].clientY};
      azimuth -= dx*0.006;
      polar = Math.min(Math.PI-0.15, Math.max(0.15, polar - dy*0.006));
      updateCamera();
      e.preventDefault();
    }
  }, {passive:false});

  window.addEventListener('resize', ()=>{
    camera.aspect = containerEl.clientWidth/containerEl.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(containerEl.clientWidth, containerEl.clientHeight);
  });
}

let camTargetY = 2;
function updateCamera(){
  camera.position.set(
    radius*Math.sin(polar)*Math.sin(azimuth),
    radius*Math.cos(polar)+camTargetY,
    radius*Math.sin(polar)*Math.cos(azimuth)
  );
  camera.lookAt(0, camTargetY, 0);
}
// Sets `radius` so the container's bounding sphere exactly fills the current
// viewport (accounting for both vertical and horizontal FOV), so a fresh
// render is always framed correctly without needing to scroll-zoom manually.
function fitCameraToContainer(halfX, halfY, halfZ){
  const boundingRadius = Math.sqrt(halfX*halfX + halfY*halfY + halfZ*halfZ);
  const vFOVrad = camera.fov*Math.PI/180;
  const hFOVrad = 2*Math.atan(Math.tan(vFOVrad/2)*camera.aspect);
  const limitingFOVrad = Math.min(vFOVrad, hFOVrad);
  radius = (boundingRadius/Math.sin(limitingFOVrad/2)) * 1.25; // 1.25 = margin so edges aren't clipped
  updateCamera();
}
function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}

function clearGroup(){
  while(group.children.length) group.remove(group.children[0]);
}

function buildScene(L,W,H,placements, orientationColorMap){
  clearGroup();
  const maxDim = Math.max(L,W,H);
  const scale = 8/maxDim;
  camTargetY = (H*scale)/2;

  // container wireframe
  const contGeo = new THREE.BoxGeometry(L*scale, H*scale, W*scale);
  const contEdges = new THREE.EdgesGeometry(contGeo);
  const contLineMat = new THREE.LineBasicMaterial({color:0x4fd8c9, transparent:true, opacity:0.55, depthWrite:false});
  const contLine = new THREE.LineSegments(contEdges, contLineMat);
  contLine.position.set(0, H*scale/2, 0);
  contLine.renderOrder = 999;
  group.add(contLine);

  // depthWrite:false is essential here: a semi-transparent enclosing shell that
  // writes to the depth buffer occludes whatever is behind whichever face is
  // currently nearest the camera. As the camera orbits, a different face
  // becomes nearest and hides a different subset of boxes - that was the
  // "boxes disappearing/reappearing while rotating" bug.
  const contFaceMat = new THREE.MeshBasicMaterial({color:0x8fa0aa, transparent:true, opacity:0.06, side:THREE.DoubleSide, depthWrite:false});
  const contFace = new THREE.Mesh(contGeo, contFaceMat);
  contFace.position.set(0, H*scale/2, 0);
  contFace.renderOrder = -1;
  group.add(contFace);

  // ground grid reference
  const gridHelper = new THREE.GridHelper(Math.max(L,W)*scale*1.4, 14, 0x1a2028, 0x1a2028);
  gridHelper.position.y = 0;
  gridHelper.material.depthWrite = false;
  gridHelper.renderOrder = -2;
  group.add(gridHelper);

  const dense = placements.length <= 1500;

  if(dense){
    for(const p of placements){
      const key = p.dx.toFixed(3)+'_'+p.dy.toFixed(3)+'_'+p.dz.toFixed(3);
      const color = orientationColorMap[key] || '#4fd8c9';
      const geo = new THREE.BoxGeometry(p.dx*scale*0.98, p.dz*scale*0.98, p.dy*scale*0.98);
      const mat = new THREE.MeshPhongMaterial({color, opacity:0.92, transparent:true, shininess:20, depthWrite:true});
      const mesh = new THREE.Mesh(geo, mat);
      mesh.renderOrder = 1;
      mesh.position.set(
        (p.x + p.dx/2 - L/2)*scale,
        (p.z + p.dz/2)*scale,
        (p.y + p.dy/2 - W/2)*scale
      );
      group.add(mesh);
      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color:0x0a0d10, transparent:true, opacity:0.6, depthWrite:false}));
      line.position.copy(mesh.position);
      line.renderOrder = 2;
      group.add(line);
    }
  } else {
    // instanced rendering for very large counts (kept opaque-ish and with
    // frustumCulled disabled: InstancedMesh's default bounding sphere is
    // computed from the base geometry only, not the full set of instance
    // positions, so the whole batch can get incorrectly culled - or only
    // partially drawn - as the camera orbits. Disabling culling here draws
    // every single instance regardless of camera angle.)
    const byOrientation = {};
    for(const p of placements){
      const key = p.dx.toFixed(3)+'_'+p.dy.toFixed(3)+'_'+p.dz.toFixed(3);
      if(!byOrientation[key]) byOrientation[key] = {dx:p.dx,dy:p.dy,dz:p.dz,items:[]};
      byOrientation[key].items.push(p);
    }
    for(const key in byOrientation){
      const o = byOrientation[key];
      const color = orientationColorMap[key] || '#4fd8c9';
      const geo = new THREE.BoxGeometry(o.dx*scale*0.97, o.dz*scale*0.97, o.dy*scale*0.97);
      const mat = new THREE.MeshPhongMaterial({color, opacity:0.92, transparent:true, depthWrite:true});
      const inst = new THREE.InstancedMesh(geo, mat, o.items.length);
      inst.frustumCulled = false;
      inst.renderOrder = 1;
      const dummy = new THREE.Object3D();
      o.items.forEach((p, idx)=>{
        dummy.position.set(
          (p.x + p.dx/2 - L/2)*scale,
          (p.z + p.dz/2)*scale,
          (p.y + p.dy/2 - W/2)*scale
        );
        dummy.updateMatrix();
        inst.setMatrixAt(idx, dummy.matrix);
      });
      group.add(inst);
    }
  }

  fitCameraToContainer(L*scale/2, H*scale/2, W*scale/2);
}
document.querySelectorAll('.rotate-opt').forEach(el=>{
  el.addEventListener('click', ()=>{
    document.querySelectorAll('.rotate-opt').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    el.querySelector('input').checked = true;
  });
});

function fmtNum(n){
  if(!isFinite(n)) return '—';
  return n.toLocaleString('tr-TR', {maximumFractionDigits:2});
}

function run(){
  const L = parseFloat(document.getElementById('L').value);
  const W = parseFloat(document.getElementById('W').value);
  const H = parseFloat(document.getElementById('H').value);
  const l = parseFloat(document.getElementById('bl').value);
  const w = parseFloat(document.getElementById('bw').value);
  const h = parseFloat(document.getElementById('bh').value);
  const mode = document.querySelector('input[name="rotmode"]:checked').value;

  const warnBox = document.getElementById('warnBox');
  warnBox.style.display='none';

  if(![L,W,H,l,w,h].every(v=>isFinite(v) && v>0)){
    warnBox.textContent = 'Sıcaklık aralığı ve ürün seçin, ardından iç kutu ölçülerini pozitif sayılarla doldurun.';
    warnBox.style.display='block';
    return;
  }

  const orientations = getOrientations(l,w,h,mode);
  const memo = new Map();
  const result = solveBin(L,W,H,5,orientations,memo);

  document.getElementById('emptyMsg').style.display='none';

  const boxVol = l*w*h;
  const contVol = L*W*H;
  const usedVol = result.count*boxVol;
  const eff = contVol>0 ? (usedVol/contVol*100) : 0;
  const leftoverVol = contVol - usedVol;

  document.getElementById('stat-count').textContent = result.count;
  document.getElementById('stat-eff').textContent = fmtNum(eff)+'%';
  document.getElementById('stat-vol').textContent = fmtNum(leftoverVol);

  if(result.count===0){
    warnBox.textContent = 'Bu ölçülerle hiçbir yönelimde kutu sığmıyor. İç kutu boyutlarını veya döndürme iznini kontrol edin.';
    warnBox.style.display='block';
  }

  // build orientation color map + legend
  const orientCounts = {};
  for(const p of result.placements){
    const key = p.dx.toFixed(3)+'_'+p.dy.toFixed(3)+'_'+p.dz.toFixed(3);
    if(!orientCounts[key]) orientCounts[key] = {count:0, dx:p.dx, dy:p.dy, dz:p.dz};
    orientCounts[key].count++;
  }
  const colorMap = {};
  const keys = Object.keys(orientCounts);
  keys.forEach((k,i)=>{ colorMap[k] = PALETTE[i%PALETTE.length]; });

  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  if(keys.length===0){
    legend.innerHTML = '<span style="color:var(--text-dim)">Yerleşim yok</span>';
  } else {
    keys.forEach(k=>{
      const o = orientCounts[k];
      const div = document.createElement('div');
      div.className='item';
      div.innerHTML = `<span class="swatch" style="background:${colorMap[k]}"></span>${fmtNum(o.dx)}×${fmtNum(o.dy)}×${fmtNum(o.dz)} — ${o.count} adet`;
      legend.appendChild(div);
    });
  }

  buildScene(L,W,H,result.placements, colorMap);
}

document.getElementById('runBtn').addEventListener('click', run);
window.addEventListener('load', ()=>{ initThree(); });
</script>
